<!doctype html>
<html lang="zh-CN">
<head>

<title>几点上课 · 宣传片</title>
<style>

}

.gl{position:absolute;left:0;width:386px;height:1px;background:#e8ecea}
.gv{position:absolute;top:38px;width:1px;height:648px;background:#f0f2f1}

.evt{position:absolute;border-radius:9px;padding:6px 5px;font-size:12px;line-height:1.28;font-weight:700;color:#1f6f58;background:repeating-linear-gradient(135deg,rgba(47,125,104,.13) 0 6px,rgba(47,125,104,.07) 6px 12px);border:1.5px dashed rgba(47,125,104,.75)}

.nav{position:absolute;left:0;top:814px;width:428px;height:82px;background:#fff;border-top:1px solid #eef1ef;display:flex}

 * 几点上课 · 宣传片
 * 整片由 renderAt(t) 纯函数驱动：同一个 t 永远得到同一帧，便于逐帧导出。
 * 音效时间点统一登记在 CUES 里，由 audio.mjs 读取合成配乐与音效。
 * ==================================================================== */
const DURATION = 58;
const CUES = [];
const cue = (t, type, o = {}) => CUES.push({ t: +t.toFixed(3), type, ...o });

/* ---------- 工具 ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: x => x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inCubic: x => x * x * x,
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outQuint: x => 1 - Math.pow(1 - x, 5),
  inQuad: x => x * x,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outBackSoft: x => { const c1 = 1.1, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  outElastic: x => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -9 * x) * Math.sin((x * 9 - .75) * (2 * Math.PI / 3)) + 1,
};
const P = (t, a, d, e = E.outCubic) => e(clamp((t - a) / d));
const bump = (t, a, d) => Math.sin(Math.PI * clamp((t - a) / d));
const $ = id => document.getElementById(id);
function h(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}
function S(el, o) { for (const k in o) el.style[k] = o[k]; }
function show(el, on) { el.style.display = on ? '' : 'none'; return on; }
const rgb = hx => { hx = hx.replace('#', ''); return [0, 2, 4].map(i => parseInt(hx.substr(i, 2), 16)); };
const toHex = a => '#' + a.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
const mixHex = (a, b, k) => { const A = rgb(a), B = rgb(b); return toHex(A.map((v, i) => lerp(v, B[i], k))); };
const isLight = hx => { const [r, g, b] = rgb(hx); return .299 * r + .587 * g + .114 * b > 150; };
const fgOf = hx => isLight(hx) ? '#202725' : '#ffffff';
const blurF = v => v > .05 ? `blur(${v.toFixed(2)}px)` : 'none';

function splitChars(el, text) {
  const spans = []; let acc = false;
  for (const c of text) {
    if (c === '[') { acc = true; continue; }
    if (c === ']') { acc = false; continue; }
    if (c === '\n') { h('br', null, el); continue; }
    const s = h('span', 'ch' + (acc ? ' acc' : ''), el); s.textContent = c; spans.push(s);
  }
  return spans;
}
function animChars(spans, t, start, end, o = {}) {
  const { st = .035, dur = .6, dy = 50, blur = 12, out = .42, outDy = -34, ease = E.outCubic, scale = 0 } = o;
  spans.forEach((s, i) => {
    const a = P(t, start + i * st, dur, ease);
    const z = end != null ? P(t, end - out + i * .01, out, E.inCubic) : 0;
    const y = (1 - a) * dy + z * outDy;
    const sc = scale ? lerp(scale, 1, a) : 1;
    s.style.transform = `translateY(${y.toFixed(2)}px) scale(${sc.toFixed(3)})`;
    s.style.opacity = (Math.min(1, a * 1.4) * (1 - z)).toFixed(3);
    s.style.filter = blurF((1 - a) * blur + z * 8);
  });
}

function buildPage(parent, week, opts = {}) {

function renderTouch(tc, list, t) {

  tc.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;

}

  S(TT.p6.glow, { opacity: g.toFixed(3), transform: `scale(${(1 + g * .03).toFixed(3)})` });

  // 导入：课程依次落下
  const order = Object.keys(TT.p6.blocks);
  order.forEach((id, i) => {
    const b = TT.p6.blocks[id];
    const k = P(t, 11.75 + i * .075, .5, E.outBack);
    let tx = 0, ty = (1 - k) * -26, sc = lerp(.35, 1, k), z = '';
    let op = clamp(k * 2);
    if (id === 'phys') {
      const col = physColor(t);
      b.style.background = col.c; b.style.color = col.fg;
      sc *= 1 + bump(t, 21.2, .3) * .08 + bump(t, 21.7, .3) * .08 + bump(t, 22.2, .3) * .08 + P(t, 20.3, .4) * .06 - P(t, 22.9, .3) * .06;
      z = t > 20.3 && t < 23.2 ? '0 12px 24px -6px rgba(0,0,0,.35)' : '';
    }
    if (id === 'linalg') {
      const lift = P(t, 24.1, .35, E.outBack);
      const fk = P(t, 26.15, .8, E.inOutCubic);
      const r0 = blkRect(1, 3, 2), r1 = blkRect(3, 6, 2);
      tx = (r1.x - r0.x) * fk; ty += (r1.y - r0.y) * fk - Math.sin(Math.PI * fk) * 70;
      sc *= 1 + lift * .07 - P(t, 26.95, .3, E.outBack) * .07 + bump(t, 26.95, .25) * -.04;
      z = t > 24.1 && t < 27.2 ? '0 18px 30px -8px rgba(0,0,0,.4)' : '';
      b.style.zIndex = t > 24.1 ? 5 : '';
    }
    if (['disc', 'pe', 'ethic', 'cre'].includes(id)) op *= 1 - P(t, 27.75, .45) * .6;
    b.style.transform = `translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) scale(${sc.toFixed(3)})`;
    b.style.opacity = op.toFixed(3);
    b.style.boxShadow = z;
  });
  const gh = P(t, 26.15, .3) * (1 - P(t, 28.6, .5));
  S(TTX.ghost, { opacity: gh.toFixed(3) });
  const aj = P(t, 27.0, .4, E.outBack);
  S(TTX.adj, { transform: `scale(${aj.toFixed(3)})` });
  const sp = P(t, 27.8, .4, E.outBack);
  TTX.stops.forEach(s => { s.style.transform = `translateX(-50%) scale(${sp.toFixed(3)})`; s.style.opacity = clamp(sp * 2); });
  S(TTX.friMark, { transform: `scale(${P(t, 27.7, .4, E.outBack).toFixed(3)})` });
  // 日程
  const eg = P(t, 30.3, .35, E.outBack) * (1 - P(t, 32.25, .15));
  S(TTX.evGhost, { opacity: eg.toFixed(3), transform: `scale(${lerp(.6, 1, eg).toFixed(3)})` });
  const e1 = P(t, 32.3, .55, E.outBack), e2 = P(t, 32.95, .55, E.outBack);
  S(TTX.ev1, { opacity: clamp(e1 * 2), transform: `scale(${lerp(.3, 1, e1).toFixed(3)})` });
  S(TTX.ev2, { opacity: clamp(e2 * 2), transform: `scale(${lerp(.3, 1, e2).toFixed(3)})` });

  // 底部面板
  const sheets = [
    [TTX.detail, 18.25, 19.62, 400, .38],
    [TTX.color, 20.72, 22.95, 460, .12],
    [TTX.resched, 24.5, 26.05, 560, .38],
    [TTX.event, 30.45, 32.2, 440, .38],
  ];
  let dim = 0;
  sheets.forEach(([el, a, b, hgt, dd]) => {
    const k = P(t, a, .5, E.outBackSoft) * (1 - P(t, b, .35, E.inCubic));
    if (!show(el, k > .001)) return;
    el.style.transform = `translateY(${((1 - k) * (hgt + 30)).toFixed(1)}px)`;
    dim = Math.max(dim, clamp(k) * dd);
  });
  S(TTX.dim, { opacity: dim.toFixed(3), display: dim > .001 ? '' : 'none' });
  // 颜色选择环
  const hops = [[0, 4], [21.2, 2], [21.7, 15], [22.2, 11]];
  let from = swC(4), to = swC(4), hk = 1;
  for (let i = 1; i < hops.length; i++) if (t >= hops[i][0]) { from = swC(hops[i - 1][1]); to = swC(hops[i][1]); hk = P(t, hops[i][0], .3, E.outBack); }
  // swC 给的是屏幕坐标，选择环在面板内（面板顶 436）
  S(TTX.ring, { left: (lerp(from.x, to.x, hk) - 31).toFixed(1) + 'px', top: (lerp(from.y, to.y, hk) - 436 - 31).toFixed(1) + 'px' });
  TTX.cDone.style.transform = `scale(${1 - bump(t, 22.83, .2) * .05})`;
  // 调课面板里的选择
  const d16 = t > 25.15, p67 = t > 25.6;
  S(TTX.calCells[16], { background: d16 ? '#7055B5' : '', color: d16 ? '#fff' : '', transform: `scale(${1 + bump(t, 25.15, .25) * .12})` });
  TTX.secPills.forEach((p, i) => { const on = i === 2 && p67; S(p, { background: on ? '#7055B5' : '#f2f5f4', color: on ? '#fff' : '#35403b', borderColor: on ? '#7055B5' : '#e2e7e4', transform: `scale(${i === 2 ? 1 + bump(t, 25.6, .25) * .1 : 1})` }); });
  TTX.rsBtn.style.transform = `scale(${1 - bump(t, 25.93, .2) * .05})`;
  // 日程编辑
  const nm = '社团例会';
  TTX.evName.textContent = nm.slice(0, Math.floor(clamp((t - 30.95) / .7) * nm.length + .001));
  TTX.evCaret.style.opacity = Math.floor(t * 3) % 2 ? 0 : 1;
  TTX.repChips.forEach((p, i) => { const on = i === (t > 31.85 ? 1 : 0); S(p, { background: on ? '#2f7d68' : '#f2f5f4', color: on ? '#fff' : '#35403b', borderColor: on ? '#2f7d68' : '#e2e7e4' }); });
  TTX.evSave.style.transform = `scale(${1 - bump(t, 32.13, .2) * .05})`;
  // 提示条
  [[TTX.toast1, 27.05, 27.7], [TTX.toast2, 27.95, 29.5]].forEach(([el, a, b]) => {
    const k = P(t, a, .35, E.outBack) * (1 - P(t, b, .3, E.inCubic));
    if (!show(el, k > .001)) return;
    S(el, { opacity: clamp(k * 1.5), transform: `translateX(-50%) translateY(${(1 - k) * 20}px) scale(${lerp(.9, 1, k)})` });
  });
}
function physColor(t) {
  const hops = [[21.2, PAL.amber, PAL.iris], [21.7, PAL.iris, PAL.orchid], [22.2, PAL.orchid, PAL.mint]];
  let c = PAL.amber, fg = fgOf(PAL.amber);
  for (const [ht, a, b] of hops) if (t >= ht + .05) { const k = P(t, ht + .05, .3); c = mixHex(a, b, k); fg = fgOf(k > .5 ? b : a); }
  return { c, fg };
}

function renderShare(t) {
  if (L.share.style.display === 'none') return;
  SH.cells.forEach((c, i) => {
    const k = P(t, 34.55 + i * .08, .45, E.outBack);
    S(c, { transform: `perspective(300px) rotateX(${((1 - k) * 90).toFixed(1)}deg)`, opacity: clamp(k * 2) });
  });
  SH.members.forEach((m, i) => {
    const k = P(t, 38.25 + i * .35, .45, E.outBack);
    S(m, { opacity: clamp(k * 2), transform: `translateX(${(1 - k) * 30}px)` });
  });
}

function renderPhone2(t) {
  const wrap = $('phone2Wrap');
  beam.style.display = 'none';
  if (!show(wrap, t > 35.4 && t < 40.1)) return;
  const ik = P(t, 35.5, .75, E.outQuint), ok = P(t, 39.3, .7, E.inCubic);
  const cx = 1650 + (1 - ik) * 700 + ok * 700;
  wrap.style.left = (cx - 226).toFixed(1) + 'px';
  wrap.style.transform = `perspective(2400px) translateY(${Math.sin(t * .9) * 6}px) rotateY(${(-16 + Math.sin(t * .7) * 2 - (1 - ik) * 20).toFixed(2)}deg) rotateX(3deg) rotateZ(${((1 - ik) * 8 + ok * 8).toFixed(2)}deg) scale(.8)`;
  // 输入分享码
  P2.cells.forEach((c, i) => {
    const typed = t >= TOUCH2[i].t;
    c.textContent = typed ? CODE[i] : '';
    const active = !typed && (i === 0 || t >= TOUCH2[i - 1].t) && t < 37.3;
    S(c, { borderColor: active ? '#2f7d68' : typed ? '#cfd8d4' : '#e4e9e7', background: active ? '#f4f9f7' : '#fff', transform: `scale(${1 + bump(t, TOUCH2[i].t, .18) * .12})` });
  });
  Object.values(P2.keys).forEach(k => { k.el.style.background = '#fff'; });
  TOUCH2.slice(0, 8).forEach((e, i) => { if (t >= e.t && t < e.t + .12) P2.keys[CODE[i]].el.style.background = '#b9c4bf'; });
  const kbOut = P(t, 37.35, .35, E.inCubic);
  S(P2.kb, { transform: `translateY(${kbOut * 340}px)` });
  const sk = P(t, 37.45, .5, E.outBack);
  S(P2.sum, { opacity: clamp(sk * 2), transform: `translateY(${(1 - sk) * 40}px) scale(${lerp(.9, 1, sk)})` });
  P2.joinBtn.style.transform = `scale(${1 - bump(t, 37.93, .2) * .05})`;
  // 切到同步后的课表
  const tk = P(t, 38.15, .5, E.outQuint);
  show(P2.tt, tk > 0);
  P2.tt.style.transform = `translateX(${(1 - tk) * 428}px)`;
  P2.tt.style.zIndex = 2;
  Object.values(P2.T.p6.blocks).forEach((b, i) => {
    const k = P(t, 38.35 + i * .035, .4, E.outBack);
    b.style.transform = `scale(${lerp(.3, 1, k).toFixed(3)})`;
    if (!['disc', 'pe', 'ethic', 'cre'].includes(Object.keys(P2.T.p6.blocks)[i])) b.style.opacity = clamp(k * 2);
  });
  const sp = P(t, 38.9, .4, E.outBack);
  S(P2.syncPill, { opacity: clamp(sp * 2), transform: `translateX(-50%) scale(${lerp(.7, 1, sp)})` });
  renderTouch(P2.touch, TOUCH2, t);
  // 数据飞线
  const bv = P(t, 37.5, .3) * (1 - P(t, 39.2, .3));
  beam.style.display = bv > 0 ? '' : 'none';
  beam.style.opacity = bv;
  beamDots.forEach((d, i) => {
    const k = ((t - 37.5) * .9 - i * .07) % 1;
    const pt = beamPath.getPointAtLength(clamp(k < 0 ? k + 1 : k) * beamLen);
    d.setAttribute('cx', pt.x); d.setAttribute('cy', pt.y);
  });
}

function renderCouple(t) {
  if (L.couple.style.display === 'none') return;
  CP.order.forEach((bi, i) => {
    const k = P(t, 40.55 + i * .13, .5, E.outBack);
    S(CP.blocks[bi], { transform: `scaleX(${k.toFixed(3)})`, opacity: clamp(k * 2) });
  });
  const nk = P(t, 41.6, .6, E.inOutCubic);
  S(CP.now, { transform: `scaleX(${nk})` });
  S(CP.nowDot, { transform: `scale(${P(t, 41.6, .4, E.outBack) * (1 + .25 * Math.sin(t * 6))})` });
  S(CP.nowLbl, { opacity: nk });
  CP.bands.forEach(({ e, p }, i) => {
    const k = P(t, 42.35 + i * .25, .5);
    S(e, { opacity: k, transform: `scaleY(${lerp(.2, 1, k)})` });
    if (p) { const pk = P(t, 42.5 + i * .25, .5, E.outBack); S(p, { transform: `translateX(-50%) scale(${pk})`, opacity: clamp(pk * 2) }); }
  });
  const hb = 1 + .18 * Math.max(0, Math.sin(t * 7)) * P(t, 43.2, .3) + bump(t, 43.3, .35) * .35;
  CP.heart.style.transform = `scale(${hb.toFixed(3)})`;
  CP.floaters.forEach((f, i) => {
    const a = 43.4 + i * .28, k = clamp((t - a) / 1.6);
    const on = k > 0 && k < 1;
    show(f, on);
    if (!on) return;
    S(f, { left: 200 + Math.sin(i * 2.1) * 40 + Math.sin(k * 8 + i) * 12 + 'px', top: 130 - k * 110 + 'px', opacity: (1 - k).toFixed(3), transform: `scale(${(.6 + k * .6).toFixed(3)})` });
  });
}

function renderLock(t) {
  if (L.lock.style.display === 'none') return;
  const n = P(t, 46.55, .6, E.outBack);
  S(LK.n1, { transform: `translateY(${((1 - n) * -200).toFixed(1)}px) scale(${lerp(.9, 1, n).toFixed(3)})`, opacity: clamp(n * 2) });
  const wig = Math.sin((t - 46.6) * 30) * 12 * (1 - P(t, 46.6, .9)) * (t > 46.6 ? 1 : 0);
  LK.n1.querySelector('.nt').style.transform = `rotate(${(wig * .08).toFixed(2)}deg)`;
  const s = P(t, 47.7, .55, E.outBack);
  S(LK.set, { transform: `translateY(${(1 - s) * 60}px)`, opacity: clamp(s * 2) });
  LK.time.style.transform = `scale(${1 - bump(t, 46.55, .4) * .03})`;
}

function renderOutro(t) {
  if (!show($('outro'), t > 50)) return;
  PILLS.forEach(({ e, i }) => {
    const row = Math.floor(i / 4), col = i % 4;
    const x = 700 + (col - 1.5) * 330, y = 440 + row * 130;
    const k = P(t, 50.45 + i * .1, .55, E.outBack);
    const sc = P(t, 52.55 + (i % 4) * .03, .55, E.inCubic);
    const ang = Math.atan2(y - 500, x - 700);
    const dx = Math.cos(ang) * sc * 900, dy = Math.sin(ang) * sc * 600;
    const fl = Math.sin(t * 2 + i) * 6;
    S(e, { left: x + 'px', top: y + 'px', transform: `translate(-50%,-50%) translate(${dx.toFixed(1)}px,${(dy + fl + (1 - k) * 60).toFixed(1)}px) scale(${lerp(.4, 1, k).toFixed(3)})`, opacity: (clamp(k * 2) * (1 - sc)).toFixed(3) });
  });
  const lg = P(t, 52.85, .9, E.outBack);
  S($('outroLogo'), { transform: `translateY(${Math.sin(t * 2) * 6}px) scale(${lerp(.2, 1, lg).toFixed(3)}) rotate(${lerp(-25, 0, lg).toFixed(2)}deg)`, opacity: clamp(lg * 2) });
  animChars(outroTitle, t, 53.15, null, { st: .08, dur: .7, dy: 80, blur: 16, ease: E.outBack, scale: .6 });
  animChars(outroTag, t, 53.8, null, { st: .04, dur: .6, dy: 26, blur: 8 });
  INFO.forEach((e, i) => { const k = P(t, 54.35 + i * .12, .5, E.outBack); S(e, { opacity: clamp(k * 2), transform: `translateY(${(1 - k) * 30}px) scale(${lerp(.8, 1, k)})` }); });
  const fk = P(t, 54.3, 1.1, E.inOutCubic);
  S($('flare'), { left: lerp(560, 1260, fk) + 'px', opacity: bump(t, 54.3, 1.1) });
  const ft = P(t, 55.1, .6);
  S($('outroFoot'), { opacity: ft, transform: `translateY(${(1 - ft) * 16}px)` });
}

function renderAt(t) {
  renderBg(t);
  renderIntro(t);
  renderHook(t);
  renderCaptions(t);
  renderPhone(t);
  renderPhone2(t);
  renderOutro(t);
}

/* ======================================================================
 * 音效时间表
 * ==================================================================== */
(() => {
  cue(.15, 'swell'); cue(.3, 'pop', { f: 520, v: .8 }); cue(.95, 'sparkle');
  introTitle.forEach((_, i) => cue(.9 + i * .09, 'tick', { f: 1400 + i * 180, v: .5 }));
  cue(3.55, 'whoosh', { d: .7 });
  cue(4.2, 'bubble', { f: 440 }); cue(4.75, 'bubble', { f: 554 }); cue(5.3, 'bubble', { f: 659 });
  cue(6.0, 'whoosh', { d: .6 }); cue(6.55, 'impact', { v: .8 });
  cue(7.45, 'whoosh', { d: .9, up: 1 });
  for (let i = 0; i < 8; i++) cue(7.95 + i * .1, 'type');
  for (let i = 0; i < 8; i++) cue(8.8 + i * .052, 'type', { v: .35 });
  cue(10.9, 'success');
  Object.keys(TT.p6.blocks).forEach((_, i) => cue(11.75 + i * .075, 'pop', { f: 420 + (i % 8) * 60, v: .5 }));
  for (const c of CAPS.slice(1)) cue(c.a - .08, 'swish');
  cue(14.35, 'shimmer');
  cue(15.9, 'swipe'); cue(17.3, 'swipe');
  cue(18.22, 'sheet'); cue(20.7, 'sheet'); cue(24.48, 'sheet'); cue(30.42, 'sheet');
  cue(19.6, 'sheetDown'); cue(22.93, 'sheetDown'); cue(26.03, 'sheetDown'); cue(32.18, 'sheetDown');
  cue(21.22, 'blip', { f: 880 }); cue(21.72, 'blip', { f: 988 }); cue(22.22, 'blip', { f: 1175 });
  cue(26.15, 'whoosh', { d: .8, up: 1, v: .5 }); cue(26.95, 'pop', { f: 330, v: .9 });
  cue(27.75, 'stamp');
  for (let i = 0; i < 4; i++) cue(30.95 + i * .175, 'type');
  cue(32.3, 'pop', { f: 600, v: .8 }); cue(32.95, 'pop', { f: 700, v: .8 });
  SH.cells.forEach((_, i) => cue(34.55 + i * .08, 'tick', { f: 1200 + i * 90, v: .45 }));
  cue(35.5, 'whoosh', { d: .7 });
  TOUCH2.slice(0, 8).forEach(e => cue(e.t, 'type'));
  cue(37.5, 'data'); cue(38.95, 'success');
  cue(39.3, 'whoosh', { d: .6, v: .6 });
  CP.order.forEach((_, i) => cue(40.55 + i * .13, 'pop', { f: 500 + i * 45, v: .4 }));
  cue(42.4, 'sparkle'); cue(43.3, 'heart');
  cue(46.55, 'ding'); cue(47.7, 'pop', { f: 520, v: .6 });
  cue(49.8, 'whoosh', { d: .9 });
  PILLS.forEach((_, i) => cue(50.45 + i * .1, 'pop', { f: 440 + i * 55, v: .55 }));
  cue(52.5, 'whoosh', { d: .7, up: 1 }); cue(52.9, 'impact', { v: 1 }); cue(53.0, 'sparkle');
  cue(54.3, 'shimmer');
  for (const e of TOUCH1) cue(e.t, 'tap');
  for (const e of TOUCH1) if (e.hold) cue(e.t + e.hold, 'blip', { f: 740, v: .5 });
  cue(37.95, 'tap');
  CUES.sort((a, b) => a.t - b.t);
})();

/* ======================================================================
 * 预览 / 导出
 * ==================================================================== */
window.DURATION = DURATION; window.CUES = CUES; window.renderAt = renderAt;
const qs = new URLSearchParams(location.search);
function fit() {
  if (qs.has('render')) return;
  const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  $('stage').style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`;
}
fit(); addEventListener('resize', fit);
if (qs.has('t')) renderAt(+qs.get('t'));
else if (!qs.has('render')) {
  const audio = new Audio('out/audio.wav');
  let t0 = null, paused = false, pt = 0;
  const loop = now => {
    if (t0 == null) t0 = now;
    if (!paused) { pt = ((now - t0) / 1000) % DURATION; renderAt(pt); }
    requestAnimationFrame(loop);
  };
  addEventListener('click', () => { audio.currentTime = 0; audio.play().catch(() => {}); t0 = null; });
  addEventListener('keydown', e => { if (e.code === 'Space') { paused = !paused; if (!paused) t0 = performance.now() - pt * 1000; } });
  requestAnimationFrame(loop);
}
</script>
